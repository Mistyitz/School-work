<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoxKITTY</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0d0d0d;
      background-image: radial-gradient(circle at 50% 50%, rgba(30, 30, 30, 0.8), rgba(10, 10, 10, 0.95)), 
                        url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M40 0C20 0 0 20 0 40s20 40 40 40 40-20 40-40S60 0 40 0zm0 70C23.4 70 10 56.6 10 40S23.4 10 40 10s30 13.4 30 30-13.4 30-30 30z' fill='%202020' fill-opacity='0.15'/%3E%3C/svg%3E");
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    .view-screen {
      display: none;
      width: 100%;
      min-height: 100vh;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .view-screen.active {
      display: flex;
    }

    .brand-header {
      font-size: 1.5rem;
      font-weight: 800;
      color: #ff5500;
      letter-spacing: 2px;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .title {
      font-size: 2.5rem;
      font-weight: 600;
      margin-bottom: 40px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.7);
      letter-spacing: 1px;
    }

    /* Profiles Grid */
    .profiles-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 35px;
    }

    .profile-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      text-decoration: none;
      color: #aaaaaa;
      transition: transform 0.25s ease, color 0.25s ease;
      width: 140px;
    }

    .profile-card:hover {
      transform: scale(1.08);
      color: #ffffff;
    }

    .avatar-wrapper {
      position: relative;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      margin-bottom: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #444444;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      transition: border-color 0.25s ease;
    }

    .profile-card:hover .avatar-img {
      border-color: #ffffff;
    }

    .add-card .avatar-wrapper {
      border: 3px solid #ff5500;
      background: rgba(0, 0, 0, 0.4);
      transition: border-color 0.25s ease, background-color 0.25s ease;
    }

    .add-card:hover .avatar-wrapper {
      border-color: #ff7722;
      background: rgba(255, 85, 0, 0.1);
    }

    .plus-icon {
      font-size: 3.5rem;
      color: #888888;
      font-weight: 300;
      line-height: 1;
      transition: color 0.25s ease;
    }

    .add-card:hover .plus-icon {
      color: #ffffff;
    }

    .crown-badge {
      position: absolute;
      bottom: -2px;
      right: -2px;
      background-color: #ff5500;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.6);
      border: 2px solid #0d0d0d;
    }

    .crown-badge svg {
      width: 18px;
      height: 18px;
      fill: #ffffff;
    }

    .profile-name {
      font-size: 1.1rem;
      font-weight: 500;
      text-align: center;
      word-break: break-word;
      line-height: 1.3;
    }

    /* Dashboard Layout */
    .dashboard-container {
      width: 100%;
      max-width: 1100px;
      padding: 20px;
    }

    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      border-bottom: 1px solid #222222;
      padding-bottom: 15px;
    }

    .user-welcome {
      font-size: 1.8rem;
      font-weight: 600;
      color: #ffffff;
    }

    .btn-switch {
      padding: 8px 16px;
      background: transparent;
      border: 1px solid #555555;
      color: #aaaaaa;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-switch:hover {
      color: #ffffff;
      border-color: #ff5500;
      background: rgba(255,85,0,0.1);
    }

    .section-title {
      font-size: 1.4rem;
      color: #ff5500;
      margin: 25px 0 15px 0;
      font-weight: 600;
    }

    .content-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
    }

    .media-card {
      background: #181818;
      border: 1px solid #282828;
      border-radius: 10px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      transition: transform 0.2s ease, border-color 0.2s ease;
      min-height: 160px;
    }

    .media-card:hover {
      transform: translateY(-5px);
      border-color: #ff5500;
    }

    .media-icon {
      font-size: 2.5rem;
      margin-bottom: 12px;
    }

    .media-title {
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 15px;
      word-break: break-word;
    }

    .btn-play {
      width: 100%;
      padding: 10px;
      background-color: #ff5500;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
      text-decoration: none;
      display: inline-block;
    }

    .btn-play:hover {
      background-color: #ff7722;
    }

    .loading-status {
      text-align: center;
      color: #888888;
      font-size: 1.1rem;
      padding: 40px;
      grid-column: 1 / -1;
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(5px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 100;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .modal-content {
      background: #181818;
      border: 1px solid #333333;
      border-radius: 12px;
      padding: 35px 30px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      position: relative;
    }

    .modal-title {
      font-size: 1.5rem;
      margin-bottom: 20px;
      text-align: center;
      color: #ffffff;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: #aaaaaa;
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #333333;
      background-color: #222222;
      color: #ffffff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .form-control:focus {
      border-color: #ff5500;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background-color: #ff5500;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
      margin-top: 10px;
    }

    .btn-submit:hover {
      background-color: #ff7722;
    }

    .signup-link {
      display: block;
      text-align: center;
      margin-top: 18px;
      font-size: 0.85rem;
      color: #888888;
      text-decoration: underline;
      cursor: pointer;
    }

    .signup-link:hover {
      color: #cccccc;
    }

    .error-msg {
      color: #ff4444;
      font-size: 0.85rem;
      margin-top: 10px;
      text-align: center;
      min-height: 20px;
    }

    .close-btn {
      position: absolute;
      top: 12px;
      right: 15px;
      background: none;
      border: none;
      color: #888888;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .close-btn:hover {
      color: #ffffff;
    }
  </style>
</head>
<body>

  <!-- Screen 1: Profile Selector View -->
  <div id="profilesView" class="view-screen active">
    <div class="brand-header">FoxKITTY</div>
    <h1 class="title">Who's Using?</h1>
    <div class="profiles-grid" id="profilesGrid">
      
      <!-- Plus/Add Card -->
      <div class="profile-card add-card" id="addProfileBtn">
        <div class="avatar-wrapper">
          <span class="plus-icon">+</span>
          <div class="crown-badge">
            <svg viewBox="0 0 24 24">
              <path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1z"/>
            </svg>
          </div>
        </div>
        <span class="profile-name">Add New</span>
      </div>

    </div>
  </div>

  <!-- Screen 2: Main Dashboard View -->
  <div id="mainDashboardView" class="view-screen">
    <div class="dashboard-container">
      <div class="dashboard-header">
        <h2 class="user-welcome" id="welcomeText">Welcome!</h2>
        <button class="btn-switch" id="switchProfileBtn">Switch Profile</button>
      </div>

      <!-- Games Section -->
      <h3 class="section-title">🎮 Games</h3>
      <div class="content-grid" id="gamesGrid">
        <div class="loading-status">Scanning repository for games...</div>
      </div>

      <!-- Movies & Videos Section -->
      <h3 class="section-title">🎬 Movies & Videos</h3>
      <div class="content-grid" id="moviesGrid">
        <div class="loading-status">Scanning repository for movies...</div>
      </div>
    </div>
  </div>

  <!-- Login Modal -->
  <div class="modal-overlay" id="loginModal">
    <div class="modal-content">
      <button class="close-btn" id="closeModalBtn">&times;</button>
      <h2 class="modal-title">LOG IN ONLY</h2>
      <form id="loginForm">
        <div class="form-group">
          <label for="usernameInput">Username</label>
          <input type="text" id="usernameInput" class="form-control" placeholder="Enter username" required autocomplete="off">
        </div>
        <div class="form-group">
          <label for="passwordInput">Password</label>
          <input type="password" id="passwordInput" class="form-control" placeholder="Enter password" required>
        </div>
        <div class="error-msg" id="errorMsg"></div>
        <button type="submit" class="btn-submit" id="submitBtn">Log In</button>
      </form>
      <span class="signup-link" id="signUpLink">Need an account? Sign Up</span>
    </div>
  </div>

  <script>
    const GITHUB_REPO_API = "https://api.github.com/repos/Mistyitz/School-is-anoying.com/contents";
    const GITHUB_REPO_RAW_BASE = "https://raw.githubusercontent.com/Mistyitz/School-is-anoying.com/main/";
    const DEFAULT_AVATAR_URL = GITHUB_REPO_RAW_BASE + "Gemini_Generated_Image_vnszksvnszksvnsz.png";

    let activeUser = "";

    // DOM Elements
    const profilesView = document.getElementById('profilesView');
    const mainDashboardView = document.getElementById('mainDashboardView');
    const profilesGrid = document.getElementById('profilesGrid');
    const addProfileBtn = document.getElementById('addProfileBtn');
    const loginModal = document.getElementById('loginModal');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const loginForm = document.getElementById('loginForm');
    const usernameInput = document.getElementById('usernameInput');
    const passwordInput = document.getElementById('passwordInput');
    const errorMsg = document.getElementById('errorMsg');
    const signUpLink = document.getElementById('signUpLink');
    const switchProfileBtn = document.getElementById('switchProfileBtn');
    const welcomeText = document.getElementById('welcomeText');
    const gamesGrid = document.getElementById('gamesGrid');
    const moviesGrid = document.getElementById('moviesGrid');

    // Show Modal
    addProfileBtn.addEventListener('click', () => {
      errorMsg.textContent = '';
      loginForm.reset();
      loginModal.classList.add('active');
      usernameInput.focus();
    });

    // Close Modal
    closeModalBtn.addEventListener('click', () => {
      loginModal.classList.remove('active');
    });

    loginModal.addEventListener('click', (e) => {
      if (e.target === loginModal) {
        loginModal.classList.remove('active');
      }
    });

    // Trap Sign Up Link
    signUpLink.addEventListener('click', () => {
      const win = window.open('about:blank', '_blank');
      if (win) {
        win.document.write('<body style="background:#000;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;font-family:sans-serif;font-size:3rem;font-weight:bold;">NOOOOOOOOOOOOOOO</body>');
        win.document.title = "NOOOOOOOOOOOOOOO";
      } else {
        alert("NOOOOOOOOOOOOOOO");
      }
    });

    // Handle Login Form Submit
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      if (!username || !password) return;

      errorMsg.textContent = 'Verifying credentials...';

      try {
        const txtUrl = `${GITHUB_REPO_RAW_BASE}${username}.txt`;
        const response = await fetch(txtUrl);

        if (!response.ok) {
          errorMsg.textContent = 'User not found.';
          return;
        }

        const rawPassword = await response.text();

        if (rawPassword.trim() === password) {
          const userAvatarUrl = `${GITHUB_REPO_RAW_BASE}${username}.png`;
          const resolvedAvatar = await checkImageExists(userAvatarUrl) ? userAvatarUrl : DEFAULT_AVATAR_URL;

          addProfileCard(username, resolvedAvatar);

          loginForm.reset();
          loginModal.classList.remove('active');

          // Log user into main screen
          openDashboard(username);
        } else {
          errorMsg.textContent = 'Incorrect password.';
        }
      } catch (err) {
        errorMsg.textContent = 'Failed to verify user. Please check network connection.';
      }
    });

    function checkImageExists(url) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(true);
        img.onerror = () => resolve(false);
        img.src = url;
      });
    }

    function addProfileCard(username, avatarUrl) {
      const card = document.createElement('div');
      card.className = 'profile-card';

      card.innerHTML = `
        <div class="avatar-wrapper">
          <img class="avatar-img" src="${avatarUrl}" alt="${username}" onerror="this.src='${DEFAULT_AVATAR_URL}'">
        </div>
        <span class="profile-name">${username}</span>
      `;

      card.addEventListener('click', () => {
        openDashboard(username);
      });

      profilesGrid.insertBefore(card, addProfileBtn);
    }

    function openDashboard(username) {
      activeUser = username;
      welcomeText.textContent = `Welcome, ${username}!`;
      profilesView.classList.remove('active');
      mainDashboardView.classList.add('active');
      
      // Load Games and Movies dynamically from GitHub
      loadRepoContents();
    }

    switchProfileBtn.addEventListener('click', () => {
      mainDashboardView.classList.remove('active');
      profilesView.classList.add('active');
    });

    // Smart detector that decides whether to inject an iframe link or raw code inside about:blank
    async function launchSmartContentInAboutBlank(rawUrl, title, isVideo = false) {
      const win = window.open('about:blank', '_blank');
      if (!win) {
        alert('Please allow popups to launch games or movies!');
        return;
      }

      win.document.title = "Loading " + title + "...";
      win.document.write('<body style="background:#000;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;font-family:sans-serif;font-size:1.5rem;">Loading content...</body>');

      try {
        if (isVideo) {
          // Fetch raw video as a blob
          const res = await fetch(rawUrl);
          const blob = await res.blob();
          const videoObjectURL = URL.createObjectURL(blob);

          win.document.open();
          win.document.write(`
            <!DOCTYPE html>
            <html>
            <head>
              <title>${title}</title>
              <style>
                body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; display: flex; justify-content: center; align-items: center; overflow: hidden; }
                video { width: 100%; height: 100%; max-width: 100%; max-height: 100%; }
              </style>
            </head>
            <body>
              <video src="${videoObjectURL}" controls autoplay></video>
            </body>
            </html>
          `);
          win.document.close();
        } else {
          // Fetch raw file text to analyze
          const res = await fetch(rawUrl);
          const rawCodeText = await res.text();

          // Check if file contains a URL or redirect (e.g., http://, https://, location.href, src="http...")
          const urlMatch = rawCodeText.match(/(https?:\/\/[^\s"'<>]+)/i);
          const isRedirect = /location\.href\s*=|window\.location|meta\s+http-equiv=["']refresh/i.test(rawCodeText);

          if (isRedirect && urlMatch && urlMatch[1]) {
            // It contains a link or redirect! Inject as full-screen iframe inside about:blank
            const targetUrl = urlMatch[1];
            win.document.open();
            win.document.write(`
              <!DOCTYPE html>
              <html>
              <head>
                <title>${title}</title>
                <style>
                  body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
                  iframe { border: none; width: 100%; height: 100%; }
                </style>
              </head>
              <body>
                <iframe src="${targetUrl}" allowfullscreen></iframe>
              </body>
              </html>
            `);
            win.document.close();
          } else {
            // Pure code (no external links/redirects). Inject raw HTML code into about:blank
            win.document.open();
            win.document.write(rawCodeText);
            win.document.close();
          }
        }
      } catch (err) {
        win.document.open();
        win.document.write('<body style="background:#000;color:#ff4444;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;font-family:sans-serif;font-size:1.5rem;">Failed to fetch raw content.</body>');
        win.document.close();
      }
    }

    // Fetch repository contents via GitHub API
    async function loadRepoContents() {
      gamesGrid.innerHTML = '<div class="loading-status">Scanning repository for games...</div>';
      moviesGrid.innerHTML = '<div class="loading-status">Scanning repository for movies...</div>';

      try {
        const response = await fetch(GITHUB_REPO_API);
        if (!response.ok) throw new Error("Failed to load repository contents.");

        const files = await response.json();

        let games = [];
        let movies = [];

        files.forEach(file => {
          const name = file.name.toLowerCase();

          if (name.endsWith('.html') && name !== 'index.html') {
            games.push(file);
          } else if (name.endsWith('.mp4') || name.endsWith('.webm') || name.endsWith('.mkv')) {
            movies.push(file);
          }
        });

        // Render Games
        if (games.length > 0) {
          gamesGrid.innerHTML = '';
          games.forEach(file => {
            const displayName = formatFileName(file.name);
            const rawUrl = `${GITHUB_REPO_RAW_BASE}${file.name}`;
            
            const card = document.createElement('div');
            card.className = 'media-card';
            card.innerHTML = `
              <div class="media-icon">🎮</div>
              <div class="media-title">${displayName}</div>
              <button class="btn-play">Launch Game</button>
            `;

            card.querySelector('.btn-play').addEventListener('click', () => {
              launchSmartContentInAboutBlank(rawUrl, displayName, false);
            });

            gamesGrid.appendChild(card);
          });
        } else {
          gamesGrid.innerHTML = '<div class="loading-status">No games found in repository.</div>';
        }

        // Render Movies
        if (movies.length > 0) {
          moviesGrid.innerHTML = '';
          movies.forEach(file => {
            const displayName = formatFileName(file.name);
            const rawUrl = `${GITHUB_REPO_RAW_BASE}${file.name}`;

            const card = document.createElement('div');
            card.className = 'media-card';
            card.innerHTML = `
              <div class="media-icon">🎬</div>
              <div class="media-title">${displayName}</div>
              <button class="btn-play">Play Video</button>
            `;

            card.querySelector('.btn-play').addEventListener('click', () => {
              launchSmartContentInAboutBlank(rawUrl, displayName, true);
            });

            moviesGrid.appendChild(card);
          });
        } else {
          moviesGrid.innerHTML = '<div class="loading-status">No movies or videos found in repository.</div>';
        }

      } catch (err) {
        gamesGrid.innerHTML = '<div class="loading-status">Failed to load content from GitHub.</div>';
        moviesGrid.innerHTML = '<div class="loading-status">Failed to load content from GitHub.</div>';
      }
    }

    function formatFileName(filename) {
      return filename
        .replace(/\.[^/.]+$/, "") // Remove file extension
        .replace(/[-_]/g, " ")     // Replace underscores/dashes with spaces
        .replace(/\b\w/g, l => l.toUpperCase()); // Capitalize words
    }
  </script>
</body>
</html>
